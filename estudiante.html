<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EducaPro - Mi Portal Estudiantil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand text-warning fw-bold fs-4" href="index.html">🎓 EducaPro</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Inscripción</a></li>
            <li class="nav-item"><a class="nav-link" href="pago.html">Pago Matrícula</a></li>
            <li class="nav-item"><a class="nav-link active fw-semibold" href="estudiante.html">Mi Portal</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5" id="contenedorPortal">
  </main>

  <script>
    const alumnoData = localStorage.getItem('alumnoInscrito');
    const contenedor = document.getElementById('contenedorPortal');

    if (alumnoData) {
      const alumno = JSON.parse(alumnoData);

      if (alumno.pagado) {
        contenedor.innerHTML = `
          <section class="card shadow-sm border-0 rounded-3 p-4 mb-4 bg-white">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <h1 class="h3 fw-bold text-dark mb-1">Bienvenido(a), ${alumno.nombre}</h1>
                <p class="text-muted mb-0">RUT: <strong>${alumno.rut}</strong> | Estado: <span class="badge bg-success">Matriculado / En Curso</span></p>
              </div>
              <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar / Borrar Inscripción</button>
            </div>
          </section>

          <section class="card shadow-sm border-0 rounded-3 p-4 mb-4 bg-white">
            <h2 class="h5 fw-bold text-dark mb-3">Mi Asignatura Activa</h2>
            <h3 class="h4 text-primary fw-bold mb-1">${alumno.curso}</h3>
            <p class="text-muted mb-3">Duración: 40 horas | Estado de Pago: <span class="badge bg-primary">Matrícula Pagada</span></p>
            <div class="progress" style="height: 20px;">
              <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 10%;">10% Completado</div>
            </div>
          </section>

          <div class="row g-4">
            <div class="col-md-6">
              <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">
                <h3 class="h5 fw-bold text-dark mb-3">Mis Calificaciones</h3>
                <p class="text-muted small">Aún no hay evaluaciones registradas para este periodo.</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">
                <h3 class="h5 fw-bold text-dark mb-3">Asistencia Registrada</h3>
                <p class="text-muted small">0% - Las clases inician próximamente.</p>
              </div>
            </div>
          </div>
        `;
      } else {
        mostrarSinInscripcion("Tienes una inscripción pendiente de pago.", "pago.html", "Ir a Pagar Matrícula");
      }
    } else {
      mostrarSinInscripcion("Actualmente no estás inscrito en ningún curso.", "contacto.html", "Inscribirme a un Curso");
    }

    function mostrarSinInscripcion(mensaje, enlace, textoBoton) {
      contenedor.innerHTML = `
        <section class="card shadow-sm border-0 rounded-3 p-5 text-center bg-white">
          <div class="py-4">
            <div class="display-1 text-muted mb-3"></div>
            <h2 class="h4 fw-bold text-dark mb-2">No tienes cursos activos</h2>
            <p class="text-muted mb-4">${mensaje}</p>
            <a href="${enlace}" class="btn btn-primary btn-lg fw-semibold shadow-sm px-4">${textoBoton}</a>
          </div>
        </section>
      `;
    }

    function cerrarSesion() {
      localStorage.removeItem('alumnoInscrito');
      window.location.reload();
    }
  </script>
</body>
</html>
