<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EducaPro - Pasarela de Pago</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">EducaPro Store</a>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow">
          <h3 class="text-center mb-4 fw-bold">Pago de Matrícula</h3>
          <form id="formPago" onsubmit="procesarPago(event)">
            <div class="mb-3">
              <label class="form-label">Método de Pago</label>
              <select class="form-select" required>
                <option value="">Seleccione método...</option>
                <option value="debito">Tarjeta de Débito</option>
                <option value="credito">Tarjeta de Crédito</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Número de Tarjeta</label>
              <input type="text" class="form-control" maxlength="16" required>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Fecha Exp.</label>
                <input type="text" class="form-control" maxlength="5" required>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">CVV</label>
                <input type="password" class="form-control" maxlength="4" required>
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Confirmar Pago</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/funciones.js"></script>
</body>
</html>
